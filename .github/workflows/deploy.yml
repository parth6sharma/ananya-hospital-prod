name: Build and Deploy to GCP (UAT)

on:
  pull_request:
    branches: [ uat ]
    types: [closed]
  push:
    branches: [uat,main]
env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REPO_REGION }}
  REPOSITORY: ananya-hospital  # Your Artifact Registry repository name
  IMAGE_NAME: ${{ secrets.GCP_REPO_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ananya-hospital/ananya-hospital
  INSTANCE_NAME: ${{ secrets.GCP_INSTANCE_NAME }}
  ZONE: ${{ secrets.GCP_ZONE }}
jobs:
  build-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Authenticate to Google Cloud
      id: auth
      uses: 'google-github-actions/auth@v2'
      with:
        workload_identity_provider: 'projects/${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.GCP_WORKLOAD_IDENTITY_POOL_ID }}/providers/${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_ID }}'
        service_account: '${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}'

    - name: Set up Cloud SDK
      uses: 'google-github-actions/setup-gcloud@v2'
      with:
        version: '>= 363.0.0'
        project_id: ${{ secrets.GCP_PROJECT_ID }} # You might still need to set the project here

    - name: Authenticate Docker to Artifact Registry
      run: |
        gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    - name: Create SSL directory and certificates
      run: |
        mkdir -p dev-certs
        echo "${{ secrets.SSL_CERT }}" | base64 -d > dev-certs/server.crt
        echo "${{ secrets.SSL_KEY }}" | base64 -d > dev-certs/server.key
        chmod 644 dev-certs/server.crt
        chmod 600 dev-certs/server.key

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: |
          ${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.IMAGE_NAME }}:uat-latest
        build-args: |
          BUILDKIT_INLINE_CACHE=1
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to GCP Compute Engine
      run: |
        gcloud compute instances update-container ${{ env.INSTANCE_NAME }} \
          --zone ${{ env.ZONE }} \
          --container-image ${{ env.IMAGE_NAME }}:${{ github.sha }}

    - name: Reboot Compute Engine Instance
      run: |
        gcloud compute instances reset ${{ env.INSTANCE_NAME }} --zone ${{ env.ZONE }} --quiet
      if: always()

    - name: Remove GCP credentials (no longer needed for this auth method)
      run: echo "GCP credentials managed by Workload Identity"
      if: always()